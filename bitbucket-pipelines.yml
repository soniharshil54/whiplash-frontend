image: docker:24.0.6-cli
options:
  docker: true

definitions:
  steps:
    - step: &init
        image: alpine:3.20
        name: Init (capture deployment env)
        script:
          - apk add --no-cache bash coreutils
          - set -euo pipefail
          - echo "DEPLOY_ENV - ${DEPLOY_ENV}"

          # branch → deploy env
          - |
            if [ "$BITBUCKET_BRANCH" = "main" ]; then
              DEPLOY_ENV="prod"
            elif [ "$BITBUCKET_BRANCH" = "staging" ]; then
              DEPLOY_ENV="staging"
            else
              echo "❌ Unsupported branch $BITBUCKET_BRANCH"; exit 1
            fi
            echo "$DEPLOY_ENV" > .deploy_env

          # keep only VITE_* variables (from Deployment vars injected into this step)
          # write as KEY=VALUE lines so the build step can turn it into .env
          - |
            : > .vite_env
            while IFS='=' read -r k v; do
              case "$k" in
                VITE_*) printf '%s=%s\n' "$k" "$v" >> .vite_env ;;
              esac
            done < <(env)
        artifacts:
          - .deploy_env
          - .vite_env

    - step: &build-push
        name: Build & Push (frontend)
        services: [docker]
        script:
          - apk add --no-cache aws-cli jq bash
          - set -euo pipefail

          - DEPLOY_ENV="$(cat .deploy_env)"

          # required
          - '[ -n "${AWS_REGION:-}" ] || { echo "AWS_REGION is required"; exit 1; }'
          - '[ -n "${PROJECT:-}" ]    || { echo "PROJECT is required"; exit 1; }'

          # image + repo
          - export DOCKER_DEFAULT_PLATFORM=linux/amd64
          - REPO_NAME="${PROJECT}-${DEPLOY_ENV}-frontend"
          - VERSION=$(cat VERSION)
          - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          - IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPO_NAME}:${VERSION}"

          # Build .env from VITE_* deployment vars captured in init
          - |
            : > .env
            cat .vite_env >> .env
            printf 'VITE_DEPLOY_ENV=%s\nVITE_BUILD_VERSION=%s\n' "$DEPLOY_ENV" "$VERSION" >> .env
            echo "Using Vite envs:" && awk -F= '{print $1"=***REDACTED***"}' .env
          - cat .env

          # ECR login + build (no BuildKit) + push
          - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          - export DOCKER_BUILDKIT=0
          - export COMPOSE_DOCKER_CLI_BUILD=0
          - export IMAGE_URI
          - docker compose -f docker-compose.build.yml build
          - docker push "${IMAGE_URI}"

          # hand off to deploy
          - echo "${VERSION}" > .version
        artifacts:
          - .deploy_env
          - .version

    - step: &deploy
        image: node:20-alpine
        name: Deploy (CDK)
        script:
          - apk add --no-cache aws-cli bash jq
          - set -euo pipefail

          - export DEPLOY_ENV="$(cat .deploy_env)"
          - echo "DEPLOY_ENV - ${DEPLOY_ENV}"
          - export VERSION="$(cat .version)"

          - '[ -n "${AWS_REGION:-}" ] || { echo "AWS_REGION is required"; exit 1; }'
          - '[ -n "${PROJECT:-}" ]    || { echo "PROJECT is required"; exit 1; }'

          - STACK_NAME="${PROJECT}-frontend-${DEPLOY_ENV}"
          - echo "🛠 Deploying to stack ${STACK_NAME} (env ${DEPLOY_ENV}) with version ${VERSION}"

          # ensure infra deps are installed and deploy via CDK
          - cd infra
          - npm ci
          - npx cdk --version
          - npx cdk context --clear || true
          - npx cdk ls -c stage="${DEPLOY_ENV}"
          - npx cdk deploy "${STACK_NAME}" --require-approval never -c stage="${DEPLOY_ENV}" -c version="${VERSION}"

pipelines:
  branches:
    main:
      - step:
          <<: *init
          deployment: prod      # deployment tag ONLY here
      - step: *build-push
      - step: *deploy
    staging:
      - step:
          <<: *init
          deployment: staging   # deployment tag ONLY here
      - step: *build-push
      - step: *deploy
